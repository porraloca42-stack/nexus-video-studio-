<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="NEXUS VIDEO STUDIO — transforme seu roteiro em vídeo.">
  <title>NEXUS VIDEO STUDIO</title>
  <style>
    :root { color-scheme: dark; background: #09090b; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #09090b; }
    .app-frame { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; background: #09090b; }
    /* Streamlit Cloud injects its attribution/fullscreen bar outside the app DOM.
       This shell masks that external strip without modifying the NEXUS app. */
    .streamlit-brand-mask {
      position: fixed; z-index: 10; left: 0; right: 0; bottom: 0;
      height: calc(84px + env(safe-area-inset-bottom));
      background: #09090b; pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe
    class="app-frame"
    title="NEXUS VIDEO STUDIO"
    src="https://htykbebk3hceoen5bvopax.streamlit.app/?embed=true"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <div class="streamlit-brand-mask" aria-hidden="true"></div>
</body>
</html>
