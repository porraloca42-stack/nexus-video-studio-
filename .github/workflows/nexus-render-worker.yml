name: NEXUS generated image render worker
run-name: NEXUS render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique render job identifier
        required: true
        type: string
      manifest_encrypted:
        description: Encrypted NEXUS storyboard JSON
        required: true
        type: string
      voice:
        description: Selected Fish Audio voice model ID
        required: true
        type: string
      fish_credentials_encrypted:
        description: Encrypted Fish Audio credentials
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install requests cryptography

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Type-check Remotion
        working-directory: remotion
        run: npm run typecheck

      - name: Generate images, narration and render MP4
        env:
          NEXUS_JOB_ID: ${{ inputs.job_id }}
          NEXUS_MANIFEST_ENCRYPTED: ${{ inputs.manifest_encrypted }}
          NEXUS_VOICE: ${{ inputs.voice }}
          NEXUS_FISH_CREDENTIALS_ENCRYPTED: ${{ inputs.fish_credentials_encrypted }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
          CLOUDFLARE_IMAGE_STEPS: "4"
        run: python -m nexus.remote_render_job

      - name: Upload rendered MP4 and report
        uses: actions/upload-artifact@v4
        with:
          name: nexus-render-${{ inputs.job_id }}
          path: |
            worker_output/${{ inputs.job_id }}/nexus_video.mp4.enc
            worker_output/${{ inputs.job_id }}/render-report.json.enc
          if-no-files-found: error
          retention-days: 3
